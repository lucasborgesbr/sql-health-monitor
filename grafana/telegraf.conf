# Telegraf Configuration for SQL Health Monitor
# ==========================================
#
# Este arquivo é uma referência para configuração do Telegraf.
# Copie para /etc/telegraf/telegraf.conf ou similar.
#
# Requisitos:
#   - Telegraf 1.24+
#   - Driver ODBC SQL Server
#   - Acesso à database SQLHealthMonitor
#
# Instalação do driver ODBC (Linux):
#   curl https://packages.microsoft.com/keys/microsoft.asc | apt-key add -
#   curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list > /etc/apt/sources.list.d/mssql-release.list
#   apt-get update
#   ACCEPT_EULA=Y apt-get install -y msodbcsql18
#   apt-get install -y unixodbc-dev

[global_tags]
  env = "production"  # Altere para: staging, dev, etc.

[agent]
  interval = "60s"              # Frequência de coleta (60s = 1 minuto)
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "60s"
  flush_jitter = "0s"
  precision = ""
  debug = false
  quiet = false
  logtarget = "file"
  logfile = "/var/log/telegraf/telegraf.log"
  logfile_rotation_interval = "1d"
  logfile_rotation_max_size = "10MB"
  logfile_rotation_max_archives = 5
  hostname = ""
  omit_hostname = false

# ===========================================
# OUTPUT: InfluxDB v2
# ===========================================
[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "$INFLUX_TOKEN"
  organization = "your-org"
  bucket = "sql-health"
  content_encoding = "gzip"

  # Tag de redundância
  [outputs.influxdb_v2.tagpass]
    # measurement = ["cpu", "memory", "disk"]  # Descomente para filtrar

  # Timeout
  timeout = "30s"

# ===========================================
# OUTPUT: Prometheus Remote Write (alternativa)
# ===========================================
# [[outputs.prometheus_client]]
#   listen = ":9273"
#   metric_version = 2
#   path = "/metrics"

# ===========================================
# INPUT: SQL Server (via ODBC)
# ===========================================
[[inputs.sqlserver]]
  # Connection strings - multiple servers supported
  servers = [
    # Windows Authentication
    "Server=SQLSERVER01;Database=SQLHealthMonitor;appname=telegraf;Integrated Security=SSPI;TrustServerCertificate=True;",
    # SQL Authentication
    # "Server=SQLSERVER02;Database=SQLHealthMonitor;appname=telegraf;User Id=telegraf;Password=YourPassword;Encrypt=yes;",
  ]

  # Query version (use 18 for SQL Server 2019+)
  query_version = "18"

  # Authentication method
  # auth_method = "WINDOWS"  # or "SQL"

  # Exclude queries (optional)
  exclude_query_id = []

# ===========================================
# INPUT: SQL Server Extended Queries
# ===========================================
# Adicione queries customizadas para o SQL Health Monitor

[[inputs.sqlserver.query]]
  measurement_name = "sql_health_cpu"
  sql = '''
    SELECT
      @@SERVERNAME AS [server],
      GETUTCDATE() AS [time],
      CAST(SqlCpuPct AS FLOAT) AS [cpu_pct],
      CAST(SystemCpuPct AS FLOAT) AS [system_cpu_pct],
      BatchRequests,
      Compilations,
      ReCompilations
    FROM [monitor].[CpuHistory]
    WHERE CollectedAt >= DATEADD(MINUTE, -5, SYSUTCDATETIME())
  '''

[[inputs.sqlserver.query]]
  measurement_name = "sql_health_memory"
  sql = '''
    SELECT
      @@SERVERNAME AS [server],
      GETUTCDATE() AS [time],
      CAST(PageLifeExpectancy AS FLOAT) AS [ple_seconds],
      CAST(BufferCacheHitRatio AS FLOAT) AS [buffer_cache_hit_ratio],
      CAST(MemoryGrantsPending AS FLOAT) AS [memory_grants_pending],
      CAST(TotalServerMemoryMB AS FLOAT) AS [total_server_memory_mb],
      CAST(SqlServerMemoryMB AS FLOAT) AS [sql_server_memory_mb]
    FROM [monitor].[MemoryHistory]
    WHERE CollectedAt >= DATEADD(MINUTE, -5, SYSUTCDATETIME())
  '''

[[inputs.sqlserver.query]]
  measurement_name = "sql_health_disk"
  sql = '''
    SELECT
      @@SERVERNAME AS [server],
      DriveLetter AS [drive],
      GETUTCDATE() AS [time],
      CAST(UsedPct AS FLOAT) AS [used_pct],
      CAST(FreeSpaceMB AS FLOAT) AS [free_space_mb],
      CAST(ReadLatencyMs AS FLOAT) AS [read_latency_ms],
      CAST(WriteLatencyMs AS FLOAT) AS [write_latency_ms]
    FROM [monitor].[DiskHistory]
    WHERE CollectedAt >= DATEADD(MINUTE, -5, SYSUTCDATETIME())
  '''

[[inputs.sqlserver.query]]
  measurement_name = "sql_health_sessions"
  sql = '''
    SELECT
      @@SERVERNAME AS [server],
      GETUTCDATE() AS [time],
      CAST(ActiveSessions AS FLOAT) AS [active_sessions],
      CAST(BlockedSessions AS FLOAT) AS [blocked_sessions],
      CAST(WaitingTasks AS FLOAT) AS [waiting_tasks],
      CAST(RunnableTasks AS FLOAT) AS [runnable_tasks]
    FROM [monitor].[SessionHistory]
    WHERE CollectedAt >= DATEADD(MINUTE, -5, SYSUTCDATETIME())
  '''

[[inputs.sqlserver.query]]
  measurement_name = "sql_health_waits"
  sql = '''
    SELECT
      @@SERVERNAME AS [server],
      WaitType AS [wait_type],
      GETUTCDATE() AS [time],
      CAST(WaitTimeMs AS FLOAT) AS [wait_time_ms],
      WaitingTasksCount AS [waiting_tasks],
      SignalWaitTimeMs AS [signal_wait_ms]
    FROM [monitor].[WaitStatsHistory]
    WHERE CollectedAt >= DATEADD(MINUTE, -5, SYSUTCDATETIME())
      AND WaitTimeMs > 0
  '''

[[inputs.sqlserver.query]]
  measurement_name = "sql_health_ag"
  sql = '''
    SELECT
      @@SERVERNAME AS [server],
      AgName AS [ag_name],
      ReplicaServer AS [replica],
      GETUTCDATE() AS [time],
      IsPrimaryReplica AS [is_primary],
      CAST(SynchronizationHealth AS FLOAT) AS [sync_health],
      CAST(BytesSentToReplica AS FLOAT) AS [bytes_sent],
      CAST(BytesReceivedFromReplica AS FLOAT) AS [bytes_received],
      CAST(SendQueueSizeKB AS FLOAT) AS [send_queue_kb],
      CAST(RedoQueueSizeKB AS FLOAT) AS [redo_queue_kb]
    FROM [monitor].[AgHealthHistory]
    WHERE CollectedAt >= DATEADD(MINUTE, -5, SYSUTCDATETIME())
  '''

[[inputs.sqlserver.query]]
  measurement_name = "sql_health_backups"
  sql = '''
    SELECT
      @@SERVERNAME AS [server],
      DatabaseName AS [database_name],
      BackupType AS [backup_type],
      GETUTCDATE() AS [time],
      CAST(HoursSinceLastFullBackup AS FLOAT) AS [hours_since_full],
      CAST(HoursSinceLastLogBackup AS FLOAT) AS [hours_since_log],
      CAST(BackupSizeMB AS FLOAT) AS [backup_size_mb]
    FROM [monitor].[BackupHistory]
    WHERE CollectedAt >= DATEADD(HOUR, -24, SYSUTCDATETIME())
  '''

[[inputs.sqlserver.query]]
  measurement_name = "sql_health_alerts"
  sql = '''
    SELECT
      @@SERVERNAME AS [server],
      AlertName AS [alert_name],
      Severity AS [severity],
      MetricName AS [metric_name],
      GETUTCDATE() AS [time],
      ThresholdValue AS [threshold],
      ActualValue AS [actual_value]
    FROM [monitor].[AlertHistory]
    WHERE FiredAt >= DATEADD(HOUR, -1, SYSUTCDATETIME())
  '''

# ===========================================
# INPUT: System (for correlation)
# ===========================================
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]
  # Memória do sistema operacional

[[inputs.disk]]
  mount_points = ["/"]

[[inputs.diskio]]
  # I/O de disco do sistema

# ===========================================
# PROCESSORS
# ===========================================
[[processors.rename]]
  [[processors.rename.replace]]
    measurement_name = "sql_health_cpu"
    dest = "cpu"

  [[processors.rename.replace]]
    measurement_name = "sql_health_memory"
    dest = "memory"

  [[processors.rename.replace]]
    measurement_name = "sql_health_disk"
    dest = "disk"

  [[processors.rename.replace]]
    measurement_name = "sql_health_sessions"
    dest = "sessions"

  [[processors.rename.replace]]
    measurement_name = "sql_health_waits"
    dest = "waits"

  [[processors.rename.replace]]
    measurement_name = "sql_health_ag"
    dest = "ag"

  [[processors.rename.replace]]
    measurement_name = "sql_health_backups"
    dest = "backups"

  [[processors.rename.replace]]
    measurement_name = "sql_health_alerts"
    dest = "alerts"

# ===========================================
# AGGREGATORS
# ===========================================
[[aggregators.basicstats]]
  period = "5m"
  drop_original = false
  stats = ["mean", "max", "min", "stdev", "count"]
