<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SQL Health - Relatório Diário</title>
<style>
body { font-family: Segoe UI, Arial, sans-serif; margin: 20px; color: #333; }
h1 { color: #1a5276; border-bottom: 2px solid #2980b9; padding-bottom: 10px; }
h2 { color: #2c3e50; margin-top: 30px; }
table { border-collapse: collapse; width: 100%; margin: 15px 0; }
th { background: #2980b9; color: white; padding: 10px; text-align: left; }
td { padding: 8px 10px; border-bottom: 1px solid #ddd; }
tr:nth-child(even) { background: #f8f9fa; }
.status-green { color: #27ae60; } .status-yellow { color: #f39c12; } .status-red { color: #e74c3c; }
.priority-high { background: #e74c3c; color: white; padding: 2px 8px; border-radius: 3px; font-size: 0.85em; }
.priority-medium { background: #f39c12; color: white; padding: 2px 8px; border-radius: 3px; font-size: 0.85em; }
.priority-low { background: #3498db; color: white; padding: 2px 8px; border-radius: 3px; font-size: 0.85em; }
.footer { margin-top: 40px; padding-top: 15px; border-top: 1px solid #ddd; color: #777; font-size: 0.85em; }
</style></head>
<body>
<h1>&#x1F4CA; Relatório Diário de Saúde - SQL Server</h1>
<p><strong>Servidor:</strong> {{SERVER_INSTANCE}} | <strong>Gerado em:</strong> {{GENERATED_AT}}</p>
<h2>Status de Saúde</h2>
{{HEALTH_STATUS}}
<h2>Recomendações</h2>
{{RECOMMENDATIONS}}
<div class="footer">Gerado por SQL Health Monitor v1.0 | Tipo: {{REPORT_TYPE}}</div>
</body></html>
